<html lang="en">

         home indicator; the CSS then pads back in with env(safe-area-inset-*). -->

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#B97A4B" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Tap today's chest for your quests and a little bonus, and keep every day you've opened."
    />
    <title>The Daily Chest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
